name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -q

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Cargo.toml declares rust-version 1.95. Linux `cargo test --workspace`
      # does not build: windows-future looks up IMarshal on the Linux target.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/shader-compiler -> target
      - name: DXBC tests
        run: cargo test --locked --target x86_64-unknown-linux-gnu -p tuxbox-dxbc --features native-bindings
      - name: XG layout tests
        run: cargo test --locked --target x86_64-unknown-linux-gnu -p tuxbox-xg-layout
      - name: Shader compiler tests
        run: cargo test --locked --target x86_64-unknown-linux-gnu --manifest-path tools/shader-compiler/Cargo.toml
      - name: D3D12 Windows typecheck
        run: cargo check --locked --target x86_64-pc-windows-msvc -p tuxbox-d3d12

  guests:
    name: Build providers, guests and Lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build/cargo
      - name: Install clang-cl and lld-link
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tools-18 lld-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      # The Windows SDK and C runtime, as the Lanes build instructions describe.
      # Downloading them accepts Microsoft's licence for these files.
      - name: Stage the Windows SDK with xwin
        run: |
          cargo install --locked cargo-xwin
          cargo xwin cache xwin --xwin-arch x86_64
      - name: Download DirectX Shader Compiler
        env:
          DXC_URL: https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/linux_dxc_2026_09_28.x86_x64.tar.gz
        run: |
          mkdir -p "$RUNNER_TEMP/dxc"
          curl -fsSL "$DXC_URL" | tar -xz -C "$RUNNER_TEMP/dxc"
          echo "DXC=$RUNNER_TEMP/dxc/bin/dxc" >> "$GITHUB_ENV"
      # CI has no GPU. This catches changes that stop the guests building;
      # running them stays a required local step.
      - name: Build everything
        run: python build.py
